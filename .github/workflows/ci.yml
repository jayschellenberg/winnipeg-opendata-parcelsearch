# CI gate: run the plain-Node test suite and a production build on every
# push / PR to main. Vercel deploys on push regardless of this workflow —
# this is the signal that tells you a push was bad; it doesn't block the
# deploy. (Audit task 0.1; the fetchSoda retry regression in 1348c06 is
# the kind of change this exists to catch.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Shallow checkout (default fetch-depth: 1) — the repo carries an
      # 82 MB pmtiles asset at HEAD, so don't pull full history.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
